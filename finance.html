<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Overview — CropWise</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="page-content" class="page">
  <div class="page-head">
    <div><div class="eyebrow">FINANCIAL OVERVIEW</div><h1 style="font-size:26px;">Financial Overview</h1><p>Sample financial data for prototype demonstration — not a real banking or lending system.</p></div>
  </div>

  <div class="grid grid-4" id="financeStats" style="margin-bottom:22px;"></div>

  <div class="grid" style="grid-template-columns:1.3fr .7fr;gap:20px;margin-bottom:22px;">
    <div class="card chart-card">
      <h3 style="font-size:15px;">Monthly sales &amp; net income trend</h3>
      <div id="trendChart"></div>
      <div class="chart-legend">
        <span class="lg"><span class="sw" style="background:var(--fresh-green);"></span>Gross sales</span>
        <span class="lg"><span class="sw" style="background:var(--dark-green);"></span>Net income</span>
      </div>
    </div>
    <div class="card chart-card">
      <h3 style="font-size:15px;">Cost breakdown</h3>
      <div id="costPie"></div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns:1fr 1fr;gap:20px;">
    <div class="card">
      <h3 style="font-size:15px;">Cash Flow</h3>
      <div id="cashFlow"></div>
    </div>
    <div class="card recommend-card">
      <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.75);">FINANCIAL INSIGHT</div>
      <h3 id="insightTitle"></h3>
      <p id="insightBody"></p>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/finance.js"></script>
</body>
</html>
