<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Your Transport — CropWise</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="page-content" class="page">
  <div class="page-head"><div><div class="eyebrow">LOGISTICS</div><h1 style="font-size:26px;">Plan Your Transport</h1><p>Transport is often the biggest hidden cost in your final profit.</p></div></div>

  <div class="grid" style="grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px;">
    <div class="card">
      <h3 style="font-size:15px;">Route</h3>
      <div class="field"><label>Pickup location</label><input type="text" id="pickup" value="Farm — Ahmedabad, Gujarat"></div>
      <div class="field"><label>Destination market</label><select id="destMarket"></select></div>
      <div class="opp-row"><span>Distance</span><b class="tabular" id="distVal">—</b></div>
      <div class="opp-row"><span>Estimated travel time</span><b id="timeVal">—</b></div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;">Logistics Cost Calculator</h3>
      <div class="field"><label>Quantity (quintals)</label><input type="number" id="qty" value="25" min="1"></div>
      <div class="field"><label>Vehicle</label><select id="vehicleSel"></select></div>
      <div class="opp-net" style="margin-top:8px;"><div class="k">Estimated transport cost</div><div class="v tabular" id="transportCostVal">—</div></div>
    </div>
  </div>

  <h3 style="font-size:16px;">Vehicle options</h3>
  <div class="grid grid-3" id="vehicleGrid" style="margin-bottom:26px;"></div>

  <div class="card">
    <h3 style="font-size:15px;">Net Return After Logistics</h3>
    <div class="grid grid-2" style="gap:20px;align-items:center;">
      <div>
        <div class="opp-row" style="padding:10px 0;"><span>Without transport (gross)</span><b class="tabular" id="withoutTransport">—</b></div>
        <div class="opp-row" style="padding:10px 0;border-top:1px solid var(--border);"><span>After transport &amp; costs</span><b class="tabular" style="color:var(--success);" id="afterTransport">—</b></div>
      </div>
      <div id="recommendedOption" class="opp-net"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/logistics.js"></script>
</body>
</html>
