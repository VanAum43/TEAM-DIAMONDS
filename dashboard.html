<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CropWise</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="page-content" class="page">

  <div class="page-head">
    <div>
      <div class="eyebrow" id="greeting">Good morning</div>
      <h1 id="userName" style="font-size:28px;">Farmer</h1>
      <p style="margin-top:4px;" id="locLine"></p>
    </div>
    <div class="card" style="padding:12px 18px;display:flex;align-items:center;gap:10px;">
      <div style="font-size:22px;">☀️ 31°C</div>
      <div style="font-size:12.5px;color:var(--text-secondary);">Clear skies today<br>Good day to transport crop</div>
    </div>
  </div>

  <div class="card" style="background:linear-gradient(135deg,var(--dark-green),var(--primary-green));color:#fff;margin-bottom:22px;padding:28px;">
    <div style="font-size:12.5px;font-weight:700;color:rgba(255,255,255,.75);margin-bottom:8px;">TODAY'S MARKET OPPORTUNITY</div>
    <div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;">
      <div>
        <div style="font-size:13px;color:rgba(255,255,255,.75);">Best estimated net return</div>
        <div id="bestNetValue" class="tabular" style="font-family:var(--font-display);font-size:46px;font-weight:600;color:#fff;">—</div>
        <div id="bestMarketName" style="font-size:14px;color:rgba(255,255,255,.85);margin-top:2px;">—</div>
      </div>
      <span id="netDiffBadge" class="badge" style="background:rgba(255,255,255,.16);color:#fff;font-size:13px;padding:7px 14px;"></span>
    </div>
  </div>

  <div class="grid grid-4" style="margin-bottom:26px;" id="quickStats"></div>

  <div class="flex-between" style="margin-bottom:14px;">
    <h2 style="font-size:19px;margin:0;">Market Opportunity</h2>
    <a href="markets.html" class="btn btn-ghost btn-sm">View all markets →</a>
  </div>
  <div class="grid grid-3" id="opportunityGrid"></div>

  <div class="grid" style="grid-template-columns:1.1fr .9fr;gap:20px;margin-top:26px;" id="lowerGrid">
    <div class="card">
      <div class="flex-between" style="margin-bottom:14px;">
        <h3 style="font-size:16px;margin:0;">Crop Snapshot</h3>
        <a href="crop-analysis.html" class="btn btn-secondary btn-sm">Analyze My Crop</a>
      </div>
      <div id="cropSnapshot"></div>
    </div>
    <div class="recommend-card">
      <div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.75);margin-bottom:6px;">RECOMMENDED ACTION</div>
      <h3 id="recTitle">—</h3>
      <p id="recReason"></p>
      <a href="market-details.html" class="btn" style="background:#fff;color:var(--dark-green);margin-top:6px;">Compare Markets</a>
    </div>
  </div>

  <div class="flex-gap" style="margin-top:28px;">
    <a href="market-details.html" class="btn btn-secondary">⇄ Compare Markets</a>
    <a href="buyers.html" class="btn btn-secondary">Find Buyers</a>
    <a href="logistics.html" class="btn btn-secondary">Plan Transport</a>
    <a href="sell-crop.html" class="btn btn-primary">Sell Crop</a>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
