<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — CropWise</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand" id="brandLogo"></div>
    <div class="auth-tag">Sell Smarter. Earn Better.</div>

    <form id="loginForm" novalidate>
      <div class="field" id="idField">
        <label for="identifier">Mobile number or email</label>
        <input type="text" id="identifier" placeholder="98250 12345">
        <div class="error-msg">Please enter your mobile number or email.</div>
      </div>
      <div class="field" id="pwField">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <div class="error-msg">Please enter your password.</div>
      </div>
      <div class="flex-between" style="margin-bottom:18px;">
        <label class="checkbox-row"><input type="checkbox" id="remember"> Remember me</label>
        <a href="#" id="forgotBtn" style="font-size:13px;color:var(--fresh-green);font-weight:700;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <div class="auth-divider">or</div>
    <button class="btn btn-secondary btn-block" id="demoBtn">Try Demo Account</button>

    <div class="auth-trust" id="trustMsg"></div>
    <div class="auth-foot">New to CropWise? <a href="signup.html" style="color:var(--primary-green);font-weight:700;">Create Account</a></div>
  </div>
</div>

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
CW.redirectIfAuthed();
document.getElementById('brandLogo').innerHTML = CW.icon('leaf') + '<span>CropWise</span>';
document.getElementById('trustMsg').innerHTML = CW.icon('shield') + '<span>Your information is protected and used only to personalize your CropWise experience.</span>';

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const idField = document.getElementById('idField');
  const pwField = document.getElementById('pwField');
  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;
  idField.classList.toggle('has-error', !identifier);
  pwField.classList.toggle('has-error', !password);
  if(!identifier || !password) return;

  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Logging in…';

  const result = await CW.login(identifier, password);
  if(result.ok){
    CW.toast('Welcome back, ' + (result.user.name ? result.user.name.split(' ')[0] : 'User') + '!', 'success');
    setTimeout(()=> window.location.href = 'dashboard.html', 500);
  }else{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Login';
    CW.toast(result.error, 'error');
  }
});

document.getElementById('demoBtn').addEventListener('click', function(){
  CW.simulateLoad(this, '', ()=>{}, 0);
  this.disabled = true;
  this.textContent = 'Loading demo account...';
  setTimeout(()=>{
    CW.demoLogin();
    CW.toast('Demo account ready — welcome, Rajesh!', 'success');
    setTimeout(()=> window.location.href = 'dashboard.html', 450);
  }, 600);
});

document.getElementById('forgotBtn').addEventListener('click', function(e){
  e.preventDefault();
  CW.toast('Password reset isn\'t available in this prototype. Try the demo account instead.', 'info');
});
</script>
</body>
</html>
